<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HattrickAI V6 | CHPP</title>
<style>body{margin:0;background:#eef3f0;color:#1c2925;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:55px auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top a{color:#197247;text-decoration:none;font-weight:800}.card{background:#fff;border-radius:20px;padding:30px;box-shadow:0 5px 24px #0001}.brand{font-size:30px;font-weight:900}.brand span{color:#19804c}.build{color:#7a847f;font-size:12px;margin:8px 0 28px}.status{padding:18px;border-radius:14px;background:#f2f5f3}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#888;margin-right:8px}.dot.on{background:#20a35c}.btn{margin-top:18px;border:0;border-radius:11px;background:#19804c;color:#fff;padding:13px 20px;font-weight:900;cursor:pointer}.sub{color:#69756f;font-size:13px;margin-top:7px}.error{display:none;margin-top:15px;background:#fff0ee;color:#9b3d33;padding:10px;border-radius:9px;font-size:12px}</style></head>
<body><main class="wrap"><div class="top"><a href="/">← Dinçer Yüksek</a><span>HattrickAI V6</span></div><section class="card"><div class="brand">Hattrick<span>AI</span> V6</div><div class="build" id="build">build …</div><div class="status"><div><i class="dot" id="dot"></i><b id="status">CHPP bağlantısı kontrol ediliyor</b></div><div class="sub" id="sub">V6 altyapısı şu aşamada yalnızca CHPP bağlantısı için hazır.</div><button class="btn" id="connect">CHPP BAĞLAN</button><div class="error" id="error"></div></div></section></main>
<script>
async function load(){const params=new URLSearchParams(location.search);const error=params.get('error');if(error){const box=document.getElementById('error');box.textContent=error;box.style.display='block'}try{const b=await fetch('/api/v5/build',{cache:'no-store'}).then(r=>r.json());document.getElementById('build').textContent='build '+String(b.build||'dev').slice(0,7)}catch{}
try{const s=await fetch('/api/v5/status',{cache:'no-store'}).then(r=>r.json());const dot=document.getElementById('dot'),btn=document.getElementById('connect');if(s.connected){dot.classList.add('on');document.getElementById('status').textContent='CHPP bağlı';document.getElementById('sub').textContent='CHPP hesabı bağlı. V6 motor özellikleri henüz etkin değil.';btn.textContent='CHPP BAĞLI'}else{document.getElementById('status').textContent='CHPP bağlı değil';document.getElementById('sub').textContent='Hattrick hesabını CHPP üzerinden bağlayabilirsin.'}}catch(e){document.getElementById('status').textContent='CHPP durumuna ulaşılamadı';document.getElementById('sub').textContent=e.message}}
document.getElementById('connect').onclick=()=>location.href='/auth/chpp/start';load();
</script></body></html>
