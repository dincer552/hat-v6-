<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HattrickAI V6 | CHPP</title>
<style>body{margin:0;background:#eef3f0;color:#1c2925;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:55px auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top a{color:#197247;text-decoration:none;font-weight:800}.card{background:#fff;border-radius:20px;padding:30px;box-shadow:0 5px 24px #0001}.brand{font-size:30px;font-weight:900}.brand span{color:#19804c}.build{color:#7a847f;font-size:12px;margin:8px 0 28px}.status{padding:18px;border-radius:14px;background:#f2f5f3}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#888;margin-right:8px}.dot.on{background:#20a35c}.btn{margin-top:18px;border:0;border-radius:11px;background:#19804c;color:#fff;padding:13px 20px;font-weight:900;cursor:pointer}.sub{color:#69756f;font-size:13px;margin-top:7px}.error{display:none;margin-top:15px;background:#fff0ee;color:#9b3d33;padding:10px;border-radius:9px;font-size:12px}
.players{display:none;margin-top:18px;border:1px solid #dfe7e3;border-radius:14px;overflow:hidden;background:#fff}
.players-head{padding:13px 15px;border-bottom:1px solid #e6ece8;display:flex;align-items:center;gap:10px}
.players-head b{font-size:14px}.players-head span{font-size:10px;color:#6d7872;flex:1}
.players-tools{padding:8px 10px;border-bottom:1px solid #e6ece8;display:flex;gap:7px}
.players-tools input{height:30px;flex:1;border:1px solid #d5dfda;border-radius:7px;padding:0 8px;font-size:10px}
.players-wrap{overflow:auto;max-height:520px}
.players table{border-collapse:collapse;min-width:1080px;width:100%;font-size:9px}
.players th,.players td{border:1px solid #e0e7e3;padding:5px 6px;white-space:nowrap;text-align:center}
.players th{background:#e9f1ed;position:sticky;top:0;z-index:2}
.players th:first-child,.players td:first-child{position:sticky;left:0;z-index:3;background:#f5f8f6;text-align:left}
.players .num{font-weight:900}.players .skill{font-weight:900}.players .danger{color:#a04439}.players .muted{color:#78837d}
.players-status{padding:9px 12px;border-top:1px solid #e6ece8;color:#68736e;font-size:9px}
@media(max-width:760px){.players table{font-size:8px}.players th,.players td{padding:4px 5px}}</style></head>
<body><main class="wrap"><div class="top"><a href="/">← Dinçer Yüksek</a><span>HattrickAI V6 · <a href="/chpp-logs" style="color:#197247;text-decoration:none;font-weight:800">CHPP LOG</a></span></div><section class="card"><div class="brand">Hattrick<span>AI</span> V6</div><div class="build" id="build">build …</div><div class="status"><div><i class="dot" id="dot"></i><b id="status">CHPP bağlantısı kontrol ediliyor</b></div><div class="sub" id="sub">V6 altyapısı şu aşamada yalnızca CHPP bağlantısı için hazır.</div><a class="btn" id="connect" href="/auth/chpp/start" style="display:inline-block;text-decoration:none">CHPP BAĞLAN</a><button class="btn" id="refreshPlayers" style="display:none">OYUNCULARI YENİLE</button><div class="error" id="error"></div>
<div class="players" id="players">
<div class="players-head"><b id="playersTitle">Oyuncular</b><span id="playersMeta">CHPP oyuncu kadrosu</span></div>
<div class="players-tools"><input id="playerSearch" placeholder="Oyuncu adı ara…"></div>
<div class="players-wrap"><table><thead><tr>
<th>Oyuncu</th><th>ID</th><th>KL</th><th>DEF</th><th>PM</th><th>PAS</th><th>KAN</th><th>GOL</th><th>STA</th><th>FORM</th><th>EXP</th><th>LOY</th><th>SP</th><th>SAKAT</th>
</tr></thead><tbody id="playersBody"></tbody></table></div>
<div class="players-status" id="playersStatus">CHPP bağlantısı bekleniyor…</div>
</div></div></section></main>
<script>
async function load(){const params=new URLSearchParams(location.search);const error=params.get('error');if(error){const box=document.getElementById('error');box.textContent=error;box.style.display='block'}try{const b=await fetch('/api/v5/build',{cache:'no-store'}).then(r=>r.json());document.getElementById('build').textContent='build '+String(b.build||'dev').slice(0,7)}catch{}
let allPlayers=[];
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function renderPlayers(){const q=document.getElementById('playerSearch').value.trim().toLocaleLowerCase('tr-TR');const body=document.getElementById('playersBody');const list=allPlayers.filter(p=>!q||String(p.name||'').toLocaleLowerCase('tr-TR').includes(q));body.innerHTML=list.map(p=>'<tr><td class="num">'+esc(p.name)+'</td><td>'+p.id+'</td><td class="skill">'+p.keeper+'</td><td class="skill">'+p.defending+'</td><td class="skill">'+p.playmaking+'</td><td class="skill">'+p.passing+'</td><td class="skill">'+p.winger+'</td><td class="skill">'+p.scoring+'</td><td class="skill">'+p.stamina+'</td><td class="skill">'+p.form+'</td><td class="skill">'+p.experience+'</td><td>'+p.loyalty+'</td><td>'+specialty(p.specialty)+'</td><td class="'+(Number(p.injuryLevel)>=0?'danger':'muted')+'">'+(Number(p.injuryLevel)>=0?p.injuryLevel:'—')+'</td></tr>').join('');document.getElementById('playersStatus').textContent=list.length+' oyuncu gösteriliyor • CHPP players v1.3'}
function specialty(v){const m={None:'—',Technical:'Teknik',Quick:'Hızlı',Powerful:'Güçlü',Unpredictable:'Öngörülemez',Head:'Kafa'};return m[v]||v||'—'}
async function loadPlayers(){const box=document.getElementById('players');const meta=document.getElementById('playersMeta');const body=document.getElementById('playersBody');try{const r=await fetch('/api/v5/team-player-export',{cache:'no-store'});if(r.status===401){box.style.display='none';return}const d=await r.json();if(!r.ok)throw Error(d.detail||d.message||'Oyuncular alınamadı');allPlayers=d.players||[];meta.textContent=(d.team?.teamName||'Takım')+' • '+allPlayers.length+' oyuncu';box.style.display='block';document.getElementById('refreshPlayers').style.display='inline-block';renderPlayers()}catch(e){body.innerHTML='';document.getElementById('playersStatus').textContent=e.message;box.style.display='block'}}
try{const s=await fetch('/api/v5/status',{cache:'no-store'}).then(r=>r.json());const dot=document.getElementById('dot'),btn=document.getElementById('connect');if(s.connected){dot.classList.add('on');document.getElementById('status').textContent='CHPP bağlı';document.getElementById('sub').textContent='CHPP hesabı bağlı. Oyuncu kadrosu aşağıda otomatik yükleniyor.';btn.textContent='CHPP BAĞLI';loadPlayers()}else{document.getElementById('status').textContent='CHPP bağlı değil';document.getElementById('sub').textContent='Hattrick hesabını CHPP üzerinden bağlayabilirsin.'}}catch(e){document.getElementById('status').textContent='CHPP durumuna ulaşılamadı';document.getElementById('sub').textContent=e.message}
document.getElementById('playerSearch')?.addEventListener('input',renderPlayers);document.getElementById('refreshPlayers')?.addEventListener('click',loadPlayers);load();
</script></body></html>
