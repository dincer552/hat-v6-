<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HattrickAI V6 | CHPP Log</title><style>body{margin:0;background:#101513;color:#e9f0ec;font-family:Consolas,monospace}.wrap{max-width:1200px;margin:25px auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.top a{color:#62d89a;text-decoration:none;font-family:Arial}.btn{border:0;border-radius:8px;padding:9px 14px;background:#19804c;color:#fff;font-weight:700;cursor:pointer;margin-left:6px}.log{background:#050807;border:1px solid #26322d;border-radius:10px;padding:14px;min-height:70vh;overflow:auto}.line{padding:6px 4px;border-bottom:1px solid #18201c;white-space:pre-wrap;word-break:break-word}.INFO{color:#cbd7d1}.ERROR{color:#ff8175;font-weight:700}.step{color:#6ee7a0}.empty{color:#7d8983;padding:20px}.status{font:13px Arial;color:#9ba8a1}</style></head><body><main class="wrap"><div class="top"><div><a href="/hattrick">← CHPP</a> <b>CHPP ADIM ADIM LOG</b><div class="status" id="status">yükleniyor…</div></div><div><button class="btn" onclick="load()">YENİLE</button><button class="btn" onclick="clearLog()">TEMİZLE</button></div></div><section class="log" id="log"></section></main><script>async function load(){try{const r=await fetch('/api/chpp/logs',{cache:'no-store'});const d=await r.json();const el=document.getElementById('log');el.innerHTML=d.entries.length?d.entries.map(x=>'<div class="line '+x.level+'">['+new Date(x.time).toLocaleString('tr-TR')+'] ['+x.level+'] <span class="step">['+esc(x.step)+']</span> '+esc(x.message)+'</div>').join(''):'<div class="empty">Henüz CHPP işlemi loglanmadı.</div>';document.getElementById('status').textContent=d.entries.length+' kayıt';el.scrollTop=el.scrollHeight}catch(e){document.getElementById('status').textContent='Log API hatası: '+e.message}}async function clearLog(){await fetch('/api/chpp/logs/clear',{method:'POST'});load()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();setInterval(load,2000);</script></body></html>
