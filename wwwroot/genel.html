const COLS=19;
function col(n){let s='';while(n){let r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s}
async function loadData(){const bytes=Uint8Array.from(atob(B64),c=>c.charCodeAt(0));const ds=new DecompressionStream('deflate');const stream=new Blob([bytes]).stream().pipeThrough(ds);const raw=await new Response(stream).text();return JSON.parse(raw)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(rows,q=''){const t=document.getElementById('sheet');let h='<thead><tr><th>#</th>';for(let c=1;c<=COLS;c++)h+='<th>'+col(c)+'</th>';h+='</tr></thead><tbody>';let shown=0;for(let r=0;r<rows.length;r++){const cells=rows[r]||[];const text=cells.map(x=>String(x[1]??'')).join(' ').toLocaleLowerCase('tr-TR');if(q&&!text.includes(q.toLocaleLowerCase('tr-TR'))&&!String(r+1).includes(q))continue;shown++;const map=new Map(cells);h+='<tr><th>'+String(r+1)+'</th>';for(let c=1;c<=COLS;c++){const v=map.get(c);const formula=typeof v==='string'&&v.startsWith('=');const constant=(c>=15&&c<=19);h+='<td class="'+(formula?'formula ':'')+(constant?'const':'')+'">'+(v==null?'':esc(v))+(formula?'<span class="formula-tag">FORMÜL</span>':'')+'</td>'}h+='</tr>'}h+='</tbody>';t.innerHTML=h;document.getElementById('meta').textContent=shown+' satır gösteriliyor • A1:S243 • tüm dolu hücreler ve formüller korundu'}
loadData().then(rows=>{window.__genelSheet=rows;render(rows);document.getElementById('q').oninput=e=>render(rows,e.target.value);document.getElementById('clear').onclick=()=>{document.getElementById('q').value='';render(rows)}}).catch(e=>{document.getElementById('meta').textContent='Genel verisi yüklenemedi: '+e.message})
</script></body></html>
