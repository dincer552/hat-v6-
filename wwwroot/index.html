<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c1718">
<title>HattrickAI V6 • CHPP</title>
<style>
body{margin:0;background:#eef1ef;color:#27322d;font-family:Arial,sans-serif}.page{max-width:620px;margin:70px auto;padding:20px}.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 3px 14px #0002;text-align:center}.brand{font-size:28px;font-weight:900}.brand span{color:#21804a}.build{font-size:11px;color:#7a827d;margin:8px 0 25px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#888;margin-right:8px}.dot.on{background:#1ea65c}.status{font-weight:800;margin:12px 0 6px}.sub{font-size:12px;color:#747c76;margin-bottom:22px}.btn{border:0;border-radius:10px;background:#21804a;color:#fff;padding:13px 20px;font-weight:900;cursor:pointer}.btn.off{background:#6f7772}.error{margin-top:18px;padding:10px;border-radius:9px;background:#fff1ef;color:#9a3b31;font-size:12px;display:none}</style>
</head>
<body><main class="page"><section class="card">
<div class="brand">Hattrick<span>AI</span> V6</div><div class="build" id="build">build …</div>
<div><i class="dot" id="dot"></i><span id="status">CHPP bağlantısı kontrol ediliyor</span></div>
<div class="sub" id="sub">V6 altyapısı şu aşamada yalnızca CHPP bağlantısı için hazır.</div>
<button class="btn off" id="connect">CHPP BAĞLAN</button><div class="error" id="error"></div>
</section></main>
<script>
async function load(){
 try{const b=await fetch('/api/v5/build',{cache:'no-store'}).then(r=>r.json());document.getElementById('build').textContent='build '+String(b.build||'dev').slice(0,7)}catch{}
 try{const s=await fetch('/api/v5/status',{cache:'no-store'}).then(r=>r.json());const dot=document.getElementById('dot'),btn=document.getElementById('connect');if(s.connected){dot.classList.add('on');document.getElementById('status').textContent='CHPP bağlı';document.getElementById('sub').textContent='CHPP hesabı bağlı. V6 motor özellikleri henüz etkin değil.';btn.textContent='CHPP BAĞLI';btn.classList.remove('off')}else{document.getElementById('status').textContent='CHPP bağlı değil';document.getElementById('sub').textContent='V6 altyapısı şu aşamada yalnızca CHPP bağlantısı için hazır.';btn.textContent='CHPP BAĞLAN';btn.classList.add('off')}}catch(e){document.getElementById('status').textContent='CHPP durumuna ulaşılamadı';document.getElementById('sub').textContent=e.message}}
document.getElementById('connect').onclick=()=>location.href='/auth/chpp/start';load();
</script></body></html>
