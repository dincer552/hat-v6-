name: HattrickAI V6 Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: v6-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V6
        uses: actions/checkout@v4
      - name: JavaScript syntax check
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in wwwroot/*.js; do
            node --check "$f"
          done
      - name: Build Docker image
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --pull --build-arg BUILD_SHA="${GITHUB_SHA}" -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:v6" .
      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
      - name: Push Docker image
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:v6"

  deploy:
    runs-on: [self-hosted, linux, x64]
    needs: build-and-push
    steps:
      - name: Deploy V6 to Azure VM
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          CHPP_CONSUMER_SECRET: ${{ secrets.CHPP_CONSUMER_SECRET }}
          CHPP_MATCHORDER_WRITE_ENABLED: "false"
        run: |
          set -Eeuo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${GITHUB_SHA}"
          LOG_DIR="/home/azureuser/hattrick-deploy"
          LOG_FILE="${LOG_DIR}/deploy.log"
          OLD_CONTAINER="hattrick-v6"
          ROLLBACK_CONTAINER="hattrick-v6-rollback"
          NEXT_CONTAINER="hattrick-v6-next"
          DEPLOY_COMMITTED=0
          HAD_OLD=0
          mkdir -p "${LOG_DIR}"; touch "${LOG_FILE}"
          log() { printf '[%s] %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" "$1" | tee -a "${LOG_FILE}"; }
          diagnostics() {
            log "========== V6 DIAGNOSTICS =========="
            docker ps -a --filter "name=${NEXT_CONTAINER}" --no-trunc | tee -a "${LOG_FILE}" || true
            docker inspect "${NEXT_CONTAINER}" --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' 2>&1 | tee -a "${LOG_FILE}" || true
            docker logs --tail 250 "${NEXT_CONTAINER}" 2>&1 | tee -a "${LOG_FILE}" || true
            curl -i --max-time 10 http://127.0.0.1:10000/health 2>&1 | tee -a "${LOG_FILE}" || true
          }
          cleanup() { docker logout ghcr.io >/dev/null 2>&1 || true; unset GHCR_TOKEN GHCR_USER CHPP_CONSUMER_SECRET CHPP_MATCHORDER_WRITE_ENABLED; }
          rollback() {
            local rc=$?
            if [ "${rc}" -ne 0 ] && [ "${DEPLOY_COMMITTED}" -ne 1 ]; then
              diagnostics
              docker rm -f "${NEXT_CONTAINER}" >/dev/null 2>&1 || true
              if [ "${HAD_OLD}" -eq 1 ]; then
                docker rename "${ROLLBACK_CONTAINER}" "${OLD_CONTAINER}" >/dev/null 2>&1 || true
                docker start "${OLD_CONTAINER}" >/dev/null 2>&1 || true
                curl --fail --silent --show-error http://127.0.0.1:10000/health >/dev/null 2>&1 || true
              fi
            fi
            cleanup
            [ "${rc}" -eq 0 ] || log "❌ V6 DEPLOY FAILED (exit code ${rc})"
            exit "${rc}"
          }
          trap rollback EXIT
          log "🚀 HattrickAI V6 VM deployment başladı"
          log "Branch: ${GITHUB_REF_NAME}"
          log "Commit: ${GITHUB_SHA:0:7}"
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          docker pull "${IMAGE}:${TAG}"
          docker logout ghcr.io >/dev/null 2>&1 || true
          unset GHCR_TOKEN GHCR_USER
          if docker ps -a --format '{{.Names}}' | grep -qx "${ROLLBACK_CONTAINER}"; then
            docker rm -f "${ROLLBACK_CONTAINER}" >/dev/null 2>&1 || true
          fi
          if docker ps -a --format '{{.Names}}' | grep -qx "${OLD_CONTAINER}"; then
            docker rename "${OLD_CONTAINER}" "${ROLLBACK_CONTAINER}"
            docker stop "${ROLLBACK_CONTAINER}" >/dev/null 2>&1 || true
            HAD_OLD=1
          fi
          docker rm -f "${NEXT_CONTAINER}" >/dev/null 2>&1 || true
          docker run -d --name "${NEXT_CONTAINER}" --restart unless-stopped -p 10000:10000             -e CHPP_CONSUMER_SECRET="${CHPP_CONSUMER_SECRET}"             -e CHPP_MATCHORDER_WRITE_ENABLED="${CHPP_MATCHORDER_WRITE_ENABLED}"             -v "${LOG_FILE}:/app/deploy.log:ro" "${IMAGE}:${TAG}"
          unset CHPP_CONSUMER_SECRET CHPP_MATCHORDER_WRITE_ENABLED
          healthy=0
          for attempt in $(seq 1 12); do
            if docker ps --filter "name=${NEXT_CONTAINER}" --filter "status=running" | grep -q "${NEXT_CONTAINER}" && curl --fail --silent --show-error http://127.0.0.1:10000/health >/dev/null; then
              healthy=1; log "❤️ V6 health check başarılı (deneme ${attempt}/12)."; break
            fi
            log "⏳ V6 health check bekleniyor (deneme ${attempt}/12)."; sleep 5
          done
          [ "${healthy}" -eq 1 ] || { log "❌ V6 health check başarısız."; exit 1; }
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:10000/ -o /dev/null
          log "🟢 V6 homepage smoke test başarılı."
          docker rename "${NEXT_CONTAINER}" "${OLD_CONTAINER}"
          DEPLOY_COMMITTED=1
          [ "${HAD_OLD}" -eq 1 ] && docker rm "${ROLLBACK_CONTAINER}" >/dev/null 2>&1 || true
          log "🟢 HattrickAI V6 VM deployment başarılı"
          docker image prune -f
