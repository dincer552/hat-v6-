name: V5 Winger + User Screenshot Regression

on:
  push:
    branches: [v5]
  workflow_dispatch:

jobs:
  winger-and-screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V5
        uses: actions/checkout@v4
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Run permanent winger regression
        run: dotnet run --project HattrickAI_V5.OfflineTests/HattrickAI_V5.OfflineTests.csproj -- empirical-winger
      - name: Run user-supplied midfielder screenshot regression
        if: ${{ always() }}
        run: dotnet run --project HattrickAI_V5.OfflineTests/HattrickAI_V5.OfflineTests.csproj -- user-im-screenshots
